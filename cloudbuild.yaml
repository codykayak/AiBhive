# Google Cloud Build — EMERGENCY local deploy only (GitHub Actions is the routine path).
#
# Do NOT run from agents for routine work — use `npm run ship` instead.
# GitHub: push main-fixed → .github/workflows/auto-deploy.yml (no PC tarball).
#
# Emergency (GitHub down):
#   ALLOW_LOCAL_GCP_DEPLOY=1 ./scripts/deploy-cloud-build.ps1
#   (sync submit — no --async — plus gcp-upload-guard.mjs)

timeout: 2400s

substitutions:
  _SERVICE: aibhive
  _REGION: us-west1

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: node:20-bookworm
    id: build
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npm run build

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy "${_SERVICE}" \
          --source . \
          --region "${_REGION}" \
          --project "$PROJECT_ID" \
          --quiet
    waitFor:
      - build
