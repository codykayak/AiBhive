# Google Cloud Build — deploy aibhive.com (web + Express API) to Cloud Run
#
# Bash / Cloud Shell:
#   gcloud builds submit --config=cloudbuild.yaml . --project=project-c223f844-6371-4c3f-a0c --async
#
# PowerShell (do NOT pass comma-separated --substitutions — PowerShell splits commas):
#   .\scripts\deploy-cloud-build.ps1
#
# Optional overrides (bash only):
#   gcloud builds submit --config=cloudbuild.yaml . --substitutions=_SERVICE=aibhive,_REGION=us-west1

timeout: 2400s

substitutions:
  _SERVICE: aibhive
  _REGION: us-west1

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: node:20-bookworm
    id: build
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npm run build

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy "${_SERVICE}" \
          --source . \
          --region "${_REGION}" \
          --project "$PROJECT_ID" \
          --quiet
    waitFor:
      - build
