# Google Cloud Build — deploy aibhive.com (web + Express API) to Cloud Run
#
# From repo root (Cloud Shell or any machine with gcloud auth):
#   gcloud builds submit --config cloudbuild.yaml . --project gen-lang-client-0787280773
#
# Override service/region:
#   gcloud builds submit --config cloudbuild.yaml . \
#     --substitutions=_SERVICE=aibhive,_REGION=us-central1

timeout: 2400s

substitutions:
  _SERVICE: aibhive
  _REGION: us-central1
  _PROJECT: gen-lang-client-0787280773

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: node:20-bookworm
    id: build
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npm run build

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy "${_SERVICE}" \
          --source . \
          --region "${_REGION}" \
          --project "${_PROJECT}" \
          --quiet
    waitFor:
      - build
