# Google Cloud Build — AiBhivePlants APK (/plants only, not full site)
#
# Use when GitHub Actions billing blocks the Build Plants APK workflow.
#
# From repo root:
#   gcloud builds submit --config aibhive-plants/cloudbuild.yaml .
#
# Note: Cloud Run hosts the website; use Cloud Build for Gradle (~20–40 min).

timeout: 3600s

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: node:20-bookworm
    id: build-plants-apk
    entrypoint: bash
    env:
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - EXPO_PUBLIC_PLANTS_URL=https://aibhive.com/plants?mobile=1
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq openjdk-17-jdk wget unzip > /dev/null

        export PATH="$$JAVA_HOME/bin:$$PATH"
        mkdir -p "$$ANDROID_HOME/cmdline-tools"
        if [ ! -d "$$ANDROID_HOME/cmdline-tools/latest" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$$ANDROID_HOME/cmdline-tools"
          mv "$$ANDROID_HOME/cmdline-tools/cmdline-tools" "$$ANDROID_HOME/cmdline-tools/latest"
        fi
        export PATH="$$ANDROID_HOME/cmdline-tools/latest/bin:$$ANDROID_HOME/platform-tools:$$PATH"
        yes | sdkmanager --licenses >/dev/null 2>&1 || true

        mkdir -p public
        cd aibhive-plants
        npm ci
        bash scripts/ci-android-build.sh
        ls -lh ../public/aibhive-plants.apk

        cd /workspace
        npm install firebase@12.11.0 --no-save --no-package-lock
        node scripts/write-plants-release.mjs
        OUTPUT_FILE="$$(mktemp)"
        node scripts/publish-plants-apk-firebase.mjs | tee "$$OUTPUT_FILE"
        rm -f "$$OUTPUT_FILE"
        node scripts/publish-plants-manifest-storage.mjs
        echo "AiBhivePlants APK published. Download: https://aibhive.com/api/download/plants-apk"
        echo "Commit public/aibhive-plants.apk + plants-mobile-releases.json to main-fixed when ready."

artifacts:
  objects:
    location: /workspace/public/
    paths:
      - aibhive-plants.apk
