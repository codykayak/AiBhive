name: EAS Update (JS OTA)
on:
  push:
    branches:
      - main-fixed
    paths:
      - 'taylored-mobile/src/**'
      - 'taylored-mobile/App.tsx'
      - 'taylored-mobile/app.json'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

jobs:
  eas-update:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        working-directory: ./taylored-mobile
        run: npm install

      - name: Publish EAS Update
        working-directory: ./taylored-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN not set — skipping OTA publish. Add the secret to enable JS-only updates."
            exit 0
          fi
          npx eas-cli update --branch production --message "OTA from ${{ github.sha }}" --non-interactive
