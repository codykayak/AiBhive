# Ships a JS bundle OTA via EAS Update on every push to main-fixed.
# Existing v1.4.0 installs receive the update on the next cold start.
# Native changes (app.json version bump, native modules) still need a fresh APK
# from `build-apk.yml` — that workflow runs in parallel on the same trigger.
name: EAS Update (JS OTA)

on:
  workflow_dispatch:
  push:
    branches: [main-fixed]
    paths:
      - 'taylored-mobile/src/**'
      - 'taylored-mobile/index.ts'
      - 'taylored-mobile/App.tsx'
      - 'taylored-mobile/package.json'
      - 'taylored-mobile/package-lock.json'
      - 'shared/**'
      - '.github/workflows/eas-update.yml'

permissions:
  contents: read

concurrency:
  group: eas-update-main-fixed
  cancel-in-progress: true

jobs:
  eas-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !contains(github.event.head_commit.message, '[skip-ota]') }}
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        working-directory: ./taylored-mobile
        run: npm install

      - name: Publish EAS Update
        working-directory: ./taylored-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN not set — skipping OTA publish."
            exit 0
          fi
          MSG="${{ github.event.head_commit.message }}"
          [ -z "$MSG" ] && MSG="OTA update"
          MSG="${MSG%%$'\n'*}"
          npx eas-cli update --branch production --message "${MSG:0:140}" --non-interactive
