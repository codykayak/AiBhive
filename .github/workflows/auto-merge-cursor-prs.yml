# Squash-merge Cursor Cloud Agent PRs automatically.
# Branches must match cursor/* (see AGENTS.md). Draft PRs are skipped until marked ready.
name: Auto-merge cursor agent PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main-fixed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  squash-merge:
    if: |
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for mergeable PR (GitHub computes async)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"
          for i in $(seq 1 12); do
            state=$(gh pr view "$pr" --repo "$repo" --json state,mergeable -q '.state + " " + (.mergeable|tostring)')
            echo "PR #$pr: $state (attempt $i/12)"
            if echo "$state" | grep -q '^MERGED'; then
              echo "Already merged."
              exit 0
            fi
            if echo "$state" | grep -q 'OPEN true$'; then
              break
            fi
            if echo "$state" | grep -q 'OPEN false$'; then
              echo "PR has merge conflicts — skipping auto-merge."
              exit 1
            fi
            sleep 5
          done

      - name: Squash merge and delete branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch
