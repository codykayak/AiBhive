name: Build Android APK
on:
  push:
    branches:
      - main-fixed
    paths:
      - 'taylored-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: 🏗 Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install dependencies
        working-directory: ./taylored-mobile
        run: npm install

      - name: 🚀 Build APK (Local Prebuild Release)
        working-directory: ./taylored-mobile
        run: |
          npx expo prebuild -p android
          cd android
          # Generate a keystore on the fly for signing the release APK
          keytool -genkey -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=TayloredMobile, OU=App, O=Taylored, L=City, ST=State, C=US"

          # Run the release build, passing the keystore properties
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-release-key.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=my-key-alias \
            -Pandroid.injected.signing.key.password=android

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taylored-mobile-apk
          path: taylored-mobile/android/app/build/outputs/apk/release/app-release.apk
