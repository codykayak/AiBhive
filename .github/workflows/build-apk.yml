name: Build Android APK
on:
  push:
    branches:
      - main-fixed
    paths:
      - 'taylored-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: 🏗 Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install dependencies
        working-directory: ./taylored-mobile
        run: npm install

      - name: 🚀 Build APK (Local Prebuild)
        working-directory: ./taylored-mobile
        run: |
          npx expo prebuild -p android
          cd android
          ./gradlew assembleDebug

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taylored-mobile-apk
          path: taylored-mobile/android/app/build/outputs/apk/debug/app-debug.apk
