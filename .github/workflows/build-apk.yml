name: Build Android APK
on:
  push:
    branches:
      - main-fixed
    paths:
      - 'taylored-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 🏗 Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        working-directory: ./taylored-mobile
        run: npm install

      - name: 🚀 Build APK (Local Prebuild Release)
        working-directory: ./taylored-mobile
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          npx expo prebuild -p android
          cd android
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          yes | sdkmanager --licenses || true

          cp ../credentials/android-release.keystore my-release-key.keystore

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-release-key.keystore \
            -Pandroid.injected.signing.store.password=taylored2026 \
            -Pandroid.injected.signing.key.alias=taylored-release \
            -Pandroid.injected.signing.key.password=taylored2026

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taylored-mobile-apk
          path: taylored-mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: 🌐 Deploy APK to public download
        run: |
          cp taylored-mobile/android/app/build/outputs/apk/release/app-release.apk public/taylored-mobile.apk
          ls -lh public/taylored-mobile.apk

      - name: 📝 Commit deployed APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/taylored-mobile.apk
          if git diff --staged --quiet; then
            echo "APK unchanged, skipping commit"
          else
            git commit -m "chore(mobile): deploy Taylored Mobile APK [skip ci]"
            git push
          fi

      - name: 📦 Install root deps (Firebase publish script)
        run: npm ci

      - name: 📲 Publish Firebase download mirror
        run: node scripts/publish-apk-firebase.mjs
