# Builds AiBhivePlants Android APK (WebView shell for aibhive.com/plants)
name: Build Plants APK

on:
  workflow_dispatch:
  push:
    branches: [main-fixed]
    paths:
      - 'aibhive-plants/**'
      - 'public/plants-mobile-releases.json'
      - 'scripts/write-plants-release.mjs'
      - 'scripts/publish-plants-apk-firebase.mjs'
      - '.github/workflows/build-plants-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-plants-apk-main-fixed
  cancel-in-progress: false

jobs:
  build-plants-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-plants-apk]') }}
    steps:
      - name: Free disk space on runner
        run: |
          echo "==> Disk before cleanup"
          df -h /
          # GitHub-hosted runners ship with large pre-installed stacks we do not need.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/Java_Temurin-Hotspot_jdk-17.0.17-7.0.x64-1" || true
          sudo docker image prune --all --force || true
          echo "==> Disk after cleanup"
          df -h /

      - name: Checkout (sparse — plants app + signing key only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            aibhive-plants
            taylored-mobile/credentials

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./aibhive-plants
        run: npm ci

      - name: Prepare output directory
        run: mkdir -p public

      - name: Build Plants APK
        working-directory: ./aibhive-plants
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
          EXPO_PUBLIC_PLANTS_URL: https://aibhive.com/plants?mobile=1
        run: bash scripts/ci-android-build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aibhive-plants-apk
          path: public/aibhive-plants.apk
          if-no-files-found: error

  publish-plants-apk:
    needs: build-plants-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-plants-apk]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.HIVE_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: aibhive-plants-apk
          path: public

      - name: Verify APK
        run: ls -lh public/aibhive-plants.apk

      - name: Update release manifest
        run: node scripts/write-plants-release.mjs

      - name: Install Firebase SDK (publish only)
        run: npm install firebase@12.11.0 --no-save --no-package-lock

      - name: Publish Firebase download mirror
        id: firebase
        run: |
          set -euo pipefail
          OUTPUT_FILE="$(mktemp)"
          node scripts/publish-plants-apk-firebase.mjs | tee "$OUTPUT_FILE"
          APK_URL=$(grep '^FIREBASE_APK_URL=' "$OUTPUT_FILE" | head -n1 | cut -d= -f2-)
          GZ_URL=$(grep '^FIREBASE_GZ_URL=' "$OUTPUT_FILE" | head -n1 | cut -d= -f2-)
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "gz_url=$GZ_URL" >> "$GITHUB_OUTPUT"

      - name: Commit deployed Plants APK + manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/aibhive-plants.apk public/plants-mobile-releases.json
          if git diff --staged --quiet; then
            echo "Plants APK unchanged, skipping commit"
          else
            git commit -m "chore(plants): deploy AiBhivePlants APK [skip-plants-apk]"
            git pull --rebase origin main-fixed
            git push origin HEAD:main-fixed
          fi

      - name: Print download links
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "  AiBhivePlants APK: https://aibhive.com/api/download/plants-apk"
          echo "  Firebase:          ${{ steps.firebase.outputs.apk_url }}"
          echo "  Web app:           https://aibhive.com/plants"
          echo "============================================================"
