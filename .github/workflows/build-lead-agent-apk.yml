# MacroREI Lead Agent — debug APK for physical phone install (no Metro).
# APK is uploaded to Firebase (too large for GitHub); /api/download/lead-agent redirects there.
name: Build Lead Agent APK

on:
  workflow_dispatch:
  push:
    branches: [main-fixed]
    paths:
      - 'mobile/lead-agent/**'
      - 'public/lead-agent-releases.json'
      - 'scripts/publish-lead-agent-apk-firebase.mjs'
      - 'scripts/write-lead-agent-release.mjs'
      - '.github/workflows/build-lead-agent-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-lead-agent-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HIVE_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-licenses: true

      - name: Build APK
        working-directory: mobile/lead-agent
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: bash scripts/ci-android-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lead-agent-apk
          path: mobile/lead-agent/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Stage APK for Firebase publish
        run: cp mobile/lead-agent/android/app/build/outputs/apk/debug/app-debug.apk public/lead-agent.apk

      - name: Install root deps (Firebase publish)
        run: npm ci

      - name: Publish Firebase download mirror
        run: node scripts/publish-lead-agent-apk-firebase.mjs

      - name: Commit release manifest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/lead-agent-releases.json
          if git diff --staged --quiet; then
            echo "Lead Agent manifest unchanged"
            exit 0
          fi
          git commit -m "chore(lead-agent): publish APK manifest (Firebase) [skip-apk]"
          git pull --rebase origin main-fixed
          git push origin HEAD:main-fixed

      - name: Download link
        if: always()
        run: |
          echo "Phone install: https://aibhive.com/api/download/lead-agent"
